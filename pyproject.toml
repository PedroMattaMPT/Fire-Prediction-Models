[project]
name = "fire-prediction-models"
version = "1.0.0"
description = "Daily wildfire-ignition risk for Portugal: trained grid models + a live service (Open-Meteo and in-situ sensors)."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyarrow>=15",
    "scikit-learn==1.8.0",   # pinned: the models are pickles saved with these
    "xgboost==3.2.0",
    "joblib>=1.3",
    "torch>=2.2",
]

[project.optional-dependencies]
# scripts/make_readme_figures.py
figures = ["matplotlib>=3.8"]

[project.urls]
"Dataset pipeline" = "https://github.com/PedroMattaMPT/Fire-Prediction-Dataset-Creation"

# Run from the repository root (the examples add it to sys.path); there is nothing
# to build — uv sets up the environment only.
[tool.uv]
package = false
